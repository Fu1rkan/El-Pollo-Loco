<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="./img/8_coin/coin_1.png" type="image/x-icon">
    <script src="./models/drawable_object.class.js"></script>
    <script src="./models/statusbar.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/background.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/salsa.class.js"></script>
    <script src="./models/endscreen.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./level/level1.js"></script>
    <script src="./models/throwable_object.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./js/game.js"></script>
    <title>El Pollo Loco</title>
</head>
<!-- <body onload="startGame()"> -->

<body onload="init()">
    <header id="header">
        <button id="resp-restart-button" class="deactive_button">
            <img src="./img/buttons/restart_button.png">
        </button>
        <h1>El Pollo Loco</h1>
        <button id="resp-pause-button" class="deactive_button">
            <img src="./img/buttons/pause_button.png">
        </button>
    </header>
    <section class="section-canvas" id="section-canvas">
        <div id="pause-menu" class="pause-menu d_none"></div>
        <canvas id="canvas" width="720" height="480" class="background-img"></canvas>
        <img src="./img/background_img/canvas_border.png" alt="" class="canvas-border">
        <div class="pause-buttons d_none" id="pause-buttons">
            <button onclick="homeMenu()" class="home-button" id="home-button">
                <img src="./img/buttons/home_button.png" alt="home">
            </button>
            <button onclick="resumeGame()" class="resume-button" id="resume-button">
                <img src="./img/buttons/play_button.png" alt="resume">
            </button>
            <button onclick="mute()" class="mute-button" id="mute-button">
                <img src="./img/buttons/unmute_button.png" alt="">
            </button>
            <button onclick="unmute()" class="mute-button d_none" id="unmute-button">
                <img src="./img/buttons/mute_button.png" alt="">
            </button>
        </div>
    </section>
    <section class="btn" id="section-buttons">
        <button id="restart-button" class="deactive_button">
            <img src="./img/buttons/restart_button.png">
        </button>
        <button onclick="startGame()" id="start-button">
            <img src="./img/buttons/start_button.png">
        </button>
        <button id="pause-button" class="deactive_button">
            <img src="./img/buttons/pause_button.png">
        </button>
    </section>
    <div class="rotate-phone-screen d_none" id="rotate-phone-screen">
        <img src="./img/responsive/rotate_phone.png" alt="">
        <h2>Please rotate your Device</h2>
    </div>
    <section class="resp-buttons" id="resp-buttons">
        <div class="left-side">
            <button id="left-button">
                <img src="./img/buttons/left_button.png" alt="" oncontextmenu="event.preventDefault()">
            </button>
            <button id="right-button">
                <img src="./img/buttons/right_button.png" alt="">
            </button>
        </div>
        <button onclick="startGame()" id="resp-start-button">
            <img src="./img/buttons/start_button.png" class="resp-start-button">
        </button>
        <div class="right-side">
            <button id="salsa-button">
                <img src="./img/buttons/salsa_button.png" alt="">
            </button>
            <button id="up-button">
                <img src="./img/buttons/up_button.png" alt="">
            </button>
        </div>
    </section>
    <footer id="footer">
        <a href="./impressum.html" target="_blank">Impressum</a>
    </footer>

</body>

</html>
