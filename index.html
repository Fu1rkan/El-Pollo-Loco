<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#222222">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./style/controls.css">
    <link rel="stylesheet" href="./style/responsive.css">
    <link rel="shortcut icon" href="./img/6_salsa_bottle/salsa_bottle.png" type="image/x-icon">
    <script src="./models/drawable_object.class.js"></script>
    <script src="./models/statusbar.class.js"></script>
    <script src="./models/statusbar-health.class.js"></script>
    <script src="./models/statusbar-bottle.class.js"></script>
    <script src="./models/statusbar-coin.class.js"></script>
    <script src="./models/statusbar-health-endboss.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/character-audio.class.js"></script>
    <script src="./models/character-animation.class.js"></script>
    <script src="./models/character-state.class.js"></script>
    <script src="./models/character-movement.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/baby_chicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/background.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/salsa.class.js"></script>
    <script src="./models/win.class.js"></script>
    <script src="./models/lose.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/endboss-audio.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./level/level1.js"></script>
    <script src="./models/throwable_object.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/world-draw.class.js"></script>
    <script src="./models/world-audio.class.js"></script>
    <script src="./models/world-flow.class.js"></script>
    <script src="./models/world-status.class.js"></script>
    <script src="./models/world-collision.class.js"></script>
    <script src="./js/variables.js"></script>
    <script src="./js/audio-manager.js"></script>
    <script src="./js/buttons.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/game.js"></script>
    <script src="./js/keyboard.js"></script>
    <title>El Pollo Loco</title>
</head>

<body onload="init()">
    <header id="header">
        <h1>El Pollo Loco</h1>
    </header>
    <section class="section-canvas" id="section-canvas">
        <canvas id="canvas" width="720" height="480" class="background-img"></canvas>
        <img src="./img/background_img/canvas_border.png" alt="" class="canvas-border">
        <div id="pause-menu" class="pause-menu d_none"></div>
        <table class="button-settings d_none" id="button-settings">
            <tr>
                <td>Left</td>
                <td>&larr; | A</td>
            </tr>
            <tr>
                <td>Right</td>
                <td>&rarr; | D</td>
            </tr>
            <tr>
                <td>Jump</td>
                <td>&uarr; | W | _</td>
            </tr>
            <tr>
                <td>Throw Item</td>
                <td>E</td>
            </tr>
            <tr>
                <td>Pause</td>
                <td>Esc</td>
            </tr>
        </table>
        <button class="close-settings-button d_none" id="close-settings-button">
            <img src="./img/buttons/close_button.png" alt="">
        </button>
    </section>
    <section class="section-buttons" id="section-buttons">
        <button id="start-button">
            <img src="./img/buttons/start_button.png" alt="start">
        </button>
        <button id="restart-button" class="d_none">
            <img src="./img/buttons/restart_button.png">
        </button>
        <button id="home-button" class="d_none">
            <img src="./img/buttons/home_button.png" alt="home">
        </button>
        <button id="settings-button">
            <img src="./img/buttons/settings_button.png" alt="settings">
        </button>
        <button id="mute-button">
            <img src="./img/buttons/unmute_button.png" alt="mute">
        </button>
        <button id="unmute-button" class="d_none">
            <img src="./img/buttons/mute_button.png" alt="unmute">
        </button>
        <button id="pause-button" class="d_none">
            <img src="./img/buttons/pause_button.png" alt="pause">
        </button>
    </section>
    <div class="rotate-phone-screen d_none" id="rotate-phone-screen">
        <img src="./img/responsive/rotate_phone.png" alt="">
        <h2>Please rotate your Device</h2>
    </div>
    <section class="resp-buttons" id="resp-buttons">
        <div class="left-side">
            <button id="left-button">
                <img src="./img/buttons/left_button.png" alt="" draggable="false">
            </button>
            <button id="right-button">
                <img src="./img/buttons/right_button.png" alt="" draggable="false">
            </button>
        </div>
        <div class="right-side">
            <button id="salsa-button">
                <img src="./img/buttons/salsa_button.png" alt="" draggable="false">
            </button>
            <button id="up-button">
                <img src="./img/buttons/up_button.png" alt="" draggable="false">
            </button>
        </div>
    </section>
    <footer>
        <a href="./impressum.html">Impressum</a>
    </footer>
</body>

</html>
