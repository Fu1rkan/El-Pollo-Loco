<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="./style.css">
    <script src="./models/drawable_object.class.js"></script>
    <script src="./models/statusbar.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/background.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/salsa.class.js"></script>
    <script src="./models/endscreen.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./level/level1.js"></script>
    <script src="./models/throwable_object.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./js/game.js"></script>
    <title>El Pollo Loco</title>
</head>
<!-- <body onload="startGame()"> -->

<body onload="init()">
    <h1>El Pollo Loco</h1>
    <section class="section-canvas" id="section-canvas">
        <div id="pause-menu" class="pause-menu d_none"></div>
        <div class="canvas-layout" id="canvas-layout">
            <canvas id="canvas" width="720" height="480" class="background-img"></canvas>
            <div class="placefiller"></div>
            <div class="resp-buttons" id="resp-buttons">
                <div class="left-side">
                    <svg width="100%" height="auto" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="bgLeft" x1="80" y1="20" x2="80" y2="140" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFD45A" />
                                <stop offset="55%" stop-color="#FFB11F" />
                                <stop offset="100%" stop-color="#F07A00" />
                            </linearGradient>

                            <linearGradient id="arrowLeft" x1="80" y1="42" x2="80" y2="118"
                                gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFF1A8" />
                                <stop offset="100%" stop-color="#FFE07A" />
                            </linearGradient>

                            <filter id="shadowLeft" x="0" y="0" width="160" height="160" filterUnits="userSpaceOnUse">
                                <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7A2E00"
                                    flood-opacity="0.28" />
                            </filter>
                        </defs>

                        <g filter="url(#shadowLeft)">
                            <circle cx="80" cy="80" r="58" fill="url(#bgLeft)" stroke="#9E4300" stroke-width="6" />
                            <circle cx="80" cy="80" r="48" fill="none" stroke="#FFE8A3" stroke-width="4"
                                opacity="0.55" />
                            <path d="M92 48L56 80L92 112" fill="none" stroke="#8F3B00" stroke-width="16"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M98 48L62 80L98 112" fill="none" stroke="url(#arrowLeft)" stroke-width="10"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </g>
                    </svg>
                    <svg width="100%" height="auto" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="bgRight" x1="80" y1="20" x2="80" y2="140"
                                gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFD45A" />
                                <stop offset="55%" stop-color="#FFB11F" />
                                <stop offset="100%" stop-color="#F07A00" />
                            </linearGradient>

                            <linearGradient id="arrowRight" x1="80" y1="42" x2="80" y2="118"
                                gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFF1A8" />
                                <stop offset="100%" stop-color="#FFE07A" />
                            </linearGradient>

                            <filter id="shadowRight" x="0" y="0" width="160" height="160" filterUnits="userSpaceOnUse">
                                <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7A2E00"
                                    flood-opacity="0.28" />
                            </filter>
                        </defs>

                        <g filter="url(#shadowRight)">
                            <circle cx="80" cy="80" r="58" fill="url(#bgRight)" stroke="#9E4300" stroke-width="6" />
                            <circle cx="80" cy="80" r="48" fill="none" stroke="#FFE8A3" stroke-width="4"
                                opacity="0.55" />
                            <path d="M68 48L104 80L68 112" fill="none" stroke="#8F3B00" stroke-width="16"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M62 48L98 80L62 112" fill="none" stroke="url(#arrowRight)" stroke-width="10"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </g>
                    </svg>
                </div>
                <div class="right-side">
                    <svg width="auto" height="100%" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="bgJump" x1="80" y1="20" x2="80" y2="140"
                                gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFD45A" />
                                <stop offset="55%" stop-color="#FFB11F" />
                                <stop offset="100%" stop-color="#F07A00" />
                            </linearGradient>

                            <linearGradient id="arrowUp" x1="80" y1="40" x2="80" y2="120">
                                <stop offset="0%" stop-color="#FFF1A8" />
                                <stop offset="100%" stop-color="#FFE07A" />
                            </linearGradient>

                            <filter id="shadowJump">
                                <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7A2E00"
                                    flood-opacity="0.25" />
                            </filter>
                        </defs>

                        <g filter="url(#shadowJump)">
                            <circle cx="80" cy="80" r="58" fill="url(#bgJump)" stroke="#9E4300" stroke-width="6" />
                            <circle cx="80" cy="80" r="48" fill="none" stroke="#FFE8A3" stroke-width="4"
                                opacity="0.5" />

                            <!-- Arrow Outline -->
                            <path d="M48 92L80 56L112 92" fill="none" stroke="#8F3B00" stroke-width="16"
                                stroke-linecap="round" stroke-linejoin="round" />

                            <!-- Arrow Fill -->
                            <path d="M54 92L80 62L106 92" fill="none" stroke="url(#arrowUp)" stroke-width="10"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </g>
                    </svg>
                    <svg width="auto" height="100%" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="bgPause" x1="80" y1="20" x2="80" y2="140"                                 
                            gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFD45A" />
                                <stop offset="55%" stop-color="#FFB11F" />
                                <stop offset="100%" stop-color="#F07A00" />
                            </linearGradient>

                            <linearGradient id="bars" x1="0" y1="40" x2="80" y2="120">
                                <stop offset="0%" stop-color="#FFF1A8" />
                                <stop offset="100%" stop-color="#FFE07A" />
                            </linearGradient>

                            <filter id="shadowPause">
                                <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7A2E00"
                                    flood-opacity="0.25" />
                            </filter>
                        </defs>

                        <g filter="url(#shadowPause)">
                            <circle cx="80" cy="80" r="58" fill="url(#bgPause)" stroke="#9E4300" stroke-width="6" />
                            <circle cx="80" cy="80" r="48" fill="none" stroke="#FFE8A3" stroke-width="4"
                                opacity="0.5" />

                            <rect x="58" y="45" width="14" height="70" rx="6" fill="url(#bars)" stroke="#8F3B00"
                                stroke-width="5" />

                            <rect x="88" y="45" width="14" height="70" rx="6" fill="url(#bars)" stroke="#8F3B00"
                                stroke-width="5" />
                        </g>
                    </svg>
                </div>
            </div>
            <div class="resp-pause-menu" id="resp-pause-menu">

            </div>
        </div>
        <img src="./img/background_img/canvas_border.png" alt="" class="canvas-border">
        <div class="pause-buttons d_none" id="pause-buttons">
            <img src="./img/buttons/home_button.png" alt="home" onclick="homeMenu()" class="home-button"
                id="home-button">
            <img src="./img/buttons/play_button.png" alt="resume" onclick="resumeGame()" class="resume-button"
                id="resume-button">
        </div>
    </section>
    <section class="btn" id="section-buttons">
        <img src="./img/buttons/restart_button.png" id="restart-button" class="deactive_button">
        <img src="./img/buttons/start_button.png" onclick="startGame()" id="start-button">
        <img src="./img/buttons/pause_button.png" id="pause-button" class="deactive_button">
    </section>
    <div class="rotate-phone-screen d_none" id="rotate-phone-screen">
        <img src="./img/responsive/rotate_phone.png" alt="">
        <h2>Please rotate your Device</h2>
    </div>

</body>

</html>
